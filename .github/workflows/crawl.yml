name: RemoteRadar - 定时爬取远程工作职位

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      spiders:
        description: '要爬取的网站'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - v2ex
          - wework
          - remoteok
          - remotive
          - stackoverflow
          - wellfound
          - remoteco
          - workingnomads
          - nofluffjobs
          - eleduck
      mode:
        description: '运行模式 (默认: API 模式)'
        required: false
        default: 'api'
        type: choice
        options:
          - api
          - local

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          
      - name: 设置 Python
        uses: actions/setup-python@v5
        timeout-minutes: 5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: 安装依赖
        timeout-minutes: 5
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: 创建数据目录
        timeout-minutes: 1
        run: |
          mkdir -p data
          
      - name: 检查 API 连接
        timeout-minutes: 1
        if: ${{ inputs.mode == 'api' || inputs.mode == '' }}
        env:
          API_URL: ${{ secrets.API_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$API_KEY" ]; then
            echo "错误: API_URL 或 API_KEY 未配置!"
            echo "请在 GitHub 仓库 Settings → Secrets and variables → Actions 中添加:"
            echo "- API_URL: 你的云服务器地址 (如 http://1.2.3.4:8001)"
            echo "- API_KEY: 你的 API 密钥"
            exit 1
          fi
          
          echo "检查 API 连接..."
          response=$(curl -s -w "%{http_code}" -o /tmp/health_response.json -H "X-API-Key: $API_KEY" "$API_URL/api/health")
          echo "HTTP 状态码: $response"
          
          if [ "$response" = "200" ]; then
            echo "API 连接成功!"
            cat /tmp/health_response.json
          else
            echo "API 连接失败! 请检查 API_URL 和 API_KEY 配置"
            echo "API_URL: $API_URL"
            exit 1
          fi
          
      - name: 运行爬虫 (API 模式)
        timeout-minutes: 20
        if: ${{ inputs.mode == 'api' || inputs.mode == '' }}
        env:
          SPIDERS: ${{ inputs.spiders || 'all' }}
          API_URL: ${{ secrets.API_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          MODE: 'api'
        run: |
          echo "开始爬取: $SPIDERS (API 模式)"
          echo "API 地址: $API_URL"
          
          if [ "$SPIDERS" = "all" ]; then
            python main.py --mode api --spiders all --delay 1.0 --max-jobs 50 --stop-after 3
          else
            python main.py --mode api --spiders $SPIDERS --delay 1.0 --max-jobs 50 --stop-after 3
          fi
          
      - name: 运行爬虫 (Local 模式)
        timeout-minutes: 20
        if: ${{ inputs.mode == 'local' }}
        env:
          SPIDERS: ${{ inputs.spiders || 'all' }}
        run: |
          echo "开始爬取: $SPIDERS (Local 模式)"
          
          if [ "$SPIDERS" = "all" ]; then
            python main.py --spiders all --delay 1.0 --max-jobs 50 --stop-after 3
          else
            python main.py --spiders $SPIDERS --delay 1.0 --max-jobs 50 --stop-after 3
          fi
          
      - name: 显示统计信息 (Local 模式)
        timeout-minutes: 2
        if: ${{ inputs.mode == 'local' }}
        run: |
          python main.py --stats
