# RemoteRadar Nginx 配置文件
# 安装:
# 1. 复制此文件到 /etc/nginx/sites-available/remoteradar.conf
# 2. 创建软链接: sudo ln -s /etc/nginx/sites-available/remoteradar.conf /etc/nginx/sites-enabled/
# 3. 测试配置: sudo nginx -t
# 4. 重载 Nginx: sudo systemctl reload nginx

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;
    
    # 强制 HTTPS (可选)
    # return 301 https://$server_name$request_uri;
    
    location / {
        # 代理到 FastAPI 后端
        proxy_pass http://127.0.0.1:8000;
        
        # 代理头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 支持 (如果需要)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # 静态文件 (如果前端构建在后端)
    location /static/ {
        alias /var/www/remoteradar/frontend/dist/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # API 缓存策略
    location /api/jobs {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # API 不缓存
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }
    
    # 访问日志
    access_log /var/log/nginx/remoteradar.access.log;
    error_log /var/log/nginx/remoteradar.error.log;
}

